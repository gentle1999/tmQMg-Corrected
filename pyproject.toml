[project]
name = "tmqmg-corrected"
version = "2026.11.23"
description = "Curated Lewis molecular graphs and supporting evidence for the tmQMg dataset"
requires-python = ">=3.10,<3.13"
dependencies = [
    "matplotlib==3.10.9",
    "networkx==3.4.2",
    "numpy==1.26.4",
    "rdkit==2026.3.1",
    "rdkit-dof==0.2.1",
]

[project.optional-dependencies]
scoring = ["molgr==0.1.10"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
checks = [
    "mypy==2.1.0",
    "pyright==1.1.408",
    "ruff==0.15.2",
    "types-networkx",
]

[tool.mypy]
python_version = "3.10"
files = ["scripts"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "rdkit_dof.*"
follow_untyped_imports = true

[tool.pyright]
include = ["scripts"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py310"
src = ["scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "W", "F", "I", "B", "C4", "UP", "SIM", "PLW", "TRY004"]
